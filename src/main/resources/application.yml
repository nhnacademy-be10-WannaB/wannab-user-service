server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: user-service
  profiles:
    active: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    discovery:
      enabled: false
    config:
      enabled: false
  config:
    import: "optional:configserver:http://config-server:10394/"

  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        highlight_sql: true
        auto_quote_keyword: true
        globally_quoted_identifiers: true

eureka:
  client:
    enabled: false